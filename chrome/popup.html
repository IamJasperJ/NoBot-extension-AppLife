<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #ffffff;
    --panel: #f6f6f7;
    --line: #e4e4e7;
    --text: #18181b;
    --muted: #71717a;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --ok: #16a34a;
    --warn: #d97706;
    --bad: #dc2626;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18181b;
      --panel: #232327;
      --line: #34343a;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #3b82f6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 360px;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  header img { width: 22px; height: 22px; border-radius: 6px; }
  h1 { flex: 1; margin: 0; font-size: 15px; font-weight: 600; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 2px 10px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line);
    font-size: 12px; white-space: nowrap;
  }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .pill.ok::before { background: var(--ok); }
  .pill.warn::before { background: var(--warn); }
  .pill.bad::before { background: var(--bad); }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; margin-bottom: 10px; display: grid; gap: 8px;
  }
  .label { font-size: 12px; color: var(--muted); }
  .muted { color: var(--muted); font-size: 12px; margin: 0; }
  .error { color: var(--bad); font-size: 12px; margin: 0; }
  .error:empty { display: none; }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  input[type="text"], textarea {
    width: 100%; height: 36px; padding: 0 10px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--text); font: inherit;
  }
  textarea { height: auto; padding: 8px 10px; resize: none; }
  textarea.mono, input.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  textarea#pairing { word-break: break-all; }
  input:focus-visible, textarea:focus-visible, button:focus-visible, summary:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  button {
    height: 36px; padding: 0 14px; border-radius: 8px; cursor: pointer; font: inherit; white-space: nowrap;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.danger { color: var(--bad); }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; }
  .switch input { appearance: none; width: 36px; height: 20px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; flex: none; margin: 0; transition: background .15s; }
  .switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked { background: var(--warn); }
  .switch input:checked::after { transform: translateX(16px); }
  details { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; }
  summary { padding: 10px 12px; cursor: pointer; font-weight: 500; list-style: none; display: flex; justify-content: space-between; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "›"; color: var(--muted); transition: transform .15s; }
  details[open] summary::after { transform: rotate(90deg); }
  details > .body { padding: 0 12px 12px; display: grid; gap: 8px; }
  #logs { margin: 0; font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); white-space: pre-wrap; max-height: 180px; overflow: auto; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <img src="icon.png" alt="">
  <h1 data-i18n="name">NoBot 浏览器桥</h1>
  <span id="state" class="pill"></span>
</header>

<p id="unsupported" class="error" data-i18n="noDebugger" hidden></p>
<p id="error" class="error" role="alert"></p>

<!-- 已配对：连接地址可改（例如换成 VPN IP），不用重新配对 -->
<section id="connection" class="card" hidden>
  <label class="label" for="address" data-i18n="address">连接地址</label>
  <div class="row">
    <input id="address" class="grow mono" type="text" autocomplete="off" spellcheck="false">
    <button type="button" id="saveAddress" data-i18n="saveAddress">保存</button>
  </div>
  <p class="muted" data-i18n="addressHint"></p>
</section>

<section id="pauseCard" class="card" hidden>
  <label class="switch" for="paused">
    <span>
      <span data-i18n="paused">暂停所有浏览器操作</span><br>
      <span class="muted" data-i18n="pausedHint"></span>
    </span>
    <input id="paused" type="checkbox">
  </label>
</section>

<!-- 未配对时展开；已配对时收起成「重新配对」 -->
<details id="pairBox">
  <summary id="pairTitle" data-i18n="pairTitle">配对</summary>
  <div class="body">
    <label class="label" for="pairing" data-i18n="pairing">粘贴配对串</label>
    <textarea id="pairing" class="mono" rows="4" autocomplete="off" spellcheck="false"></textarea>
    <div class="row">
      <button type="button" id="pair" class="primary" data-i18n="pair">配对</button>
      <span class="grow"></span>
      <button type="button" id="revoke" class="danger" data-i18n="revoke">撤销配对</button>
    </div>
    <p class="muted" data-i18n="security"></p>
  </div>
</details>

<details>
  <summary data-i18n="domains">允许的域名</summary>
  <div class="body">
    <textarea id="domains" class="mono" rows="4" spellcheck="false"></textarea>
    <div class="row">
      <span class="muted grow" data-i18n="domainsHint"></span>
      <button type="button" id="saveDomains" data-i18n="saveDomains">保存白名单</button>
    </div>
  </div>
</details>

<details>
  <summary data-i18n="logs">最近 20 条操作</summary>
  <div class="body"><pre id="logs"></pre></div>
</details>

<script type="module" src="popup.js"></script>
</body>
</html>
